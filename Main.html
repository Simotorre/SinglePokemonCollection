<!doctype html>
<html lang="it">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pokémon TCG Collection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="main.css" rel="stylesheet">
</head>

<body>
    <main class="container-fluid py-4 px-3 px-md-4">
        <header class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
            <div>
                <h1 class="mb-1">Pokémon TCG Collection</h1>
                <p class="text-secondary mb-0">Archivio carte e varianti</p>
            </div>
            <button id="backButton" class="btn btn-outline-secondary d-none">← Tutti i Pokémon</button>
        </header>
        <section id="pokemonSelection" class="selection-panel">
            <h2 class="h4 mb-3">Seleziona un Pokémon</h2>
            <div class="row g-2 align-items-end">
                <div class="col-12 col-md-8 col-lg-6">
                    <label for="pokemonSelect" class="form-label">Pokémon</label>
                    <select id="pokemonSelect" class="form-select">
                        <option value="">Scegli un Pokémon...</option>
                    </select>
                </div>
                <div class="col-auto"><button id="loadButton" class="btn btn-primary" disabled>Mostra carte</button>
                </div>
            </div>
        </section>
        <section id="cardSection" class="d-none">
            <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
                <div>
                    <h2 id="pokemonTitle" class="h3 mb-1"></h2>
                    <p id="cardCount" class="text-secondary mb-0"></p>
                </div>
                <input id="tableSearch" class="form-control search-input" type="search"
                    placeholder="Cerca set, numero, varianti...">
            </div>
            <div id="statusMessage" class="alert alert-danger d-none"></div>
            <div class="table-responsive">
                <table class="table table-hover table-bordered align-middle collection-table">
                    <thead class="table-dark">
                        <tr>
                            <th class="image-column">Immagine</th>
                            <th>Nome Set</th>
                            <th class="number-column">Numero</th>
                            <th>Varianti</th>
                        </tr>
                    </thead>
                    <tbody id="cardTableBody"></tbody>
                </table>
            </div>
        </section>
    </main>
    <!-- MODAL ZOOM CARTA -->
    <div id="imageModal" class="image-modal">
        <span id="closeModal" class="close-modal">&times;</span>
        <img id="modalImage" src="" alt="Carta ingrandita">
    </div>
    <script type="module" src="main.js"></script>
</body>

</html>
